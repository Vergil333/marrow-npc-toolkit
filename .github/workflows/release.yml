name: Create GitHub prerelease draft

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate tag and build packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/package_release.py
      - name: Create or refresh GitHub prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Documentation/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          title="Marrow NPC Toolkit ${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              Artifacts/*.tgz Artifacts/SHA256SUMS.txt --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --draft --prerelease --notes-file "${notes}" --title "${title}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              Artifacts/*.tgz Artifacts/SHA256SUMS.txt \
              --draft --prerelease --notes-file "${notes}" --title "${title}"
          fi
